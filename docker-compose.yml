name: gbstudyapply

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-gbstudyapply}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gbstudyapply_db}
      POSTGRES_USER: ${DB_USER:-gbstudyapply_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gbstudyapply_pwd}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5505}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gbstudyapply_user} -d ${DB_NAME:-gbstudyapply_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    container_name: ${COMPOSE_PROJECT_NAME:-gbstudyapply}_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9009}:9000"
      - "${MINIO_CONSOLE_PORT:-9010}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-gbstudyapply}_backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-gbstudyapply_user}
      DB_PASSWORD: ${DB_PASSWORD:-gbstudyapply_pwd}
      DB_NAME: ${DB_NAME:-gbstudyapply_db}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: gbstudyapply
    ports:
      - "${BACKEND_PORT:-3012}:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-gbstudyapply}_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8012}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
